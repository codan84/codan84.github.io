title: GabsLabs
description: Innovative solutions and cutting-edge technology from GabsLabs
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://yourusername.github.io" # your GitHub Pages URL

# GitHub Pages specific settings
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - tailwind.config.js
  - package*.json

# Markdown settings
markdown: kramdown
highlighter: rouge

# Permalink structure
permalink: /:categories/:year/:month/:day/:title/